services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: coscientist-tailscale
    hostname: coscientist-ui
    env_file: .env
    environment:
      TS_AUTHKEY: ${TAILSCALE_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_AUTH_ONCE: "true"
      TS_ACCEPT_DNS: "true"
      TS_SERVE_CONFIG: /config/tailscale_config.json
    volumes:
      - ./tailscale-state:/var/lib/tailscale
      - ./tailscale_config.json:/config/tailscale_config.json:ro
    restart: unless-stopped
    networks:
      - coscientist_net

  coscientist-api:
    build:
      context: .
      args:
        UID: ${UID}
        GID: ${GID}
    image: ${USER}_coscientist:dev
    container_name: coscientist-api
    env_file: .env
    environment:
      COSCIENTIST_ROOT: /app
    network_mode: service:tailscale
    depends_on:
      - tailscale
    volumes:
      - ./state:/app/state
      - ./researcher_data:/app/researcher_data:ro
      - ./scaffold:/app/scaffold
      - ./research:/app/research
      - ./evolution:/app/evolution
      - ./tools:/app/tools
      - ./roles:/app/roles
      - ./prompts:/app/prompts
      - ./api:/app/api
      - ./bin:/app/bin
      - ./tests:/app/tests
      - ./worktrees:/app/worktrees

  coscientist-ui:
    build:
      context: .
      args:
        UID: ${UID}
        GID: ${GID}
    image: ${USER}_coscientist:dev
    container_name: coscientist-ui
    env_file: .env
    environment:
      COSCIENTIST_ROOT: /app
      COSCIENTIST_API_URL: http://127.0.0.1:8765
      APP_PASSWORD_HASH: ${APP_PASSWORD_HASH}
    network_mode: service:tailscale
    depends_on:
      - coscientist-api
    volumes:
      - ./state:/app/state
      - ./researcher_data:/app/researcher_data:ro
      - ./ui:/app/ui
      - ./.streamlit:/app/.streamlit:ro
    command: ["streamlit", "run", "ui/app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]

networks:
  coscientist_net:
    driver: bridge